</style>

/* ---------- scoring ---------- */
function score(){
  const raw = {offer:0,demand:0,money:0,delivery:0,systems:0,owner:0};
  Q.forEach((q,idx)=>{
    if(q.d==='intent') return;
    raw[q.d] += q.o[ans[idx]][1];
  });

  const cond = {};
  for(const k in raw) cond[k] = Math.round(raw[k]/12*5);

  // ---- override rules (spec: 03-assessment-questions.md) ----
  const fired = [];
  const a = idx => q_val(idx);
  function q_val(n){ return Q[n].o[ans[n]][1]; }

  if(a(12)===3 && a(13)===0){ cond.delivery = Math.min(cond.delivery,3);
    fired.push('ส่งตรงเวลาครบ แต่ต้องทำงานดึกทุกครั้ง → Delivery ไม่เกิน 3'); }
  if(a(10)===0){ cond.money = Math.min(cond.money,1);
    fired.push('runway ไม่ถึง 1 เดือน → Money ไม่เกิน 1'); }
  if(a(11)===0){ cond.money = Math.max(0,cond.money-1);
    fired.push('ลูกค้าเจ้าเดียวเกินครึ่งของรายได้ → Money ลด 1'); }
  if(a(16)===0){ cond.systems = Math.min(cond.systems,1);
    fired.push('หายไป 2 สัปดาห์แล้วธุรกิจหยุดทันที → Systems ไม่เกิน 1'); }

  const emergency = (a(20)===0 && a(22)<=1);
  if(emergency) fired.push('ทำงาน >60 ชม. และพลังงานเหลือน้อย → เสนอ Emergency Mode ก่อนแสดงผล');

  // ---- seed STAT (spec: 02-dimensions-detail.md) ----
  const stat = {};
  for(const k in cond) stat[k] = 4 + cond[k]*8;

  const intent = Q[24].o[ans[24]][1];

  // ---- phase ----
  let phase;
  // ⚠ จุดที่ spec เดิมขัดกันเอง: "runway <3 เดือน = ทุกอย่างรอได้" กับ "Owner วิกฤต = ข้ามทุก phase"
  // ทางแก้ที่ใช้อยู่: ถ้าวิกฤตทั้งคู่ ไม่เลือกข้างใดข้างหนึ่ง แต่แสดงทั้งสองเรื่อง โดยนำด้วยเรื่องเงิน
  if(cond.owner<=1 && cond.money<=1) phase='crisis';
  else if(cond.money<=1) phase='money';
  else if(cond.owner<=1) phase='recover';
  else if(cond.offer<3) phase='p1';
  else if(cond.demand<3) phase='p2';
  else if(cond.money<3) phase='p3';
  else if(cond.delivery<3||cond.systems<3) phase='p4';
  else phase='p5';

  return {raw,cond,stat,fired,emergency,intent,phase};
}

function program(r){
  if(r.phase==='recover') return [ACTIONS.owner[0], ACTIONS.owner[1]];
  if(r.phase==='crisis')  return [ACTIONS.money[1], ACTIONS.owner[0]];
  if(r.phase==='money')   return [ACTIONS.money[1], ACTIONS.money[0], ACTIONS.money[3]];

  const f = INTENT_FOCUS[r.intent];
  // ทุกมิติแข็งแล้ว → ไม่ใช่การซ่อม แต่เป็นการเลือกทาง
  if(Object.values(r.cond).every(v=>v>=4)){
    return f.dims.slice(0,2).map(d=>({...ACTIONS[d][ACTIONS[d].length-1], dim:d}));
  }
  // จัดลำดับมิติ: อ่อนสุดก่อน แต่ให้น้ำหนักพิเศษกับมิติที่ตรงกับเจตนา
  const ranked = Object.keys(r.cond).sort((x,y)=>{
    const bx = r.cond[x] - (f.dims.includes(x)?1.5:0);
    const by = r.cond[y] - (f.dims.includes(y)?1.5:0);
    return bx-by;
  });
  // เจตนา calm = ไม่เสนอ action สาย demand เลย
  // เจตนา calm = ไม่เสนอเรื่องหาลูกค้าเลย · มิติที่แข็งแล้ว (≥4) ไม่ต้องซ่อม
  const pool = (r.intent==='calm' ? ranked.filter(d=>d!=='demand') : ranked)
                 .filter(d=>r.cond[d]<4);
  const out=[];
  for(const d of pool){
    if(out.length>=f.max) break;
    out.push({...ACTIONS[d][0], dim:d});
    if(out.length<f.max && r.cond[d]<=1) out.push({...ACTIONS[d][1], dim:d});
  }
  return out.slice(0,f.max);
}

/* ---------- radar ---------- */
function radar(stat){
  const keys=Object.keys(DIMS), N=6, cx=150, cy=160, R=92;
  const maxv = 44;
  const pt=(k,rr)=>{const ang=-Math.PI/2+k*2*Math.PI/N;
    return [cx+Math.cos(ang)*rr, cy+Math.sin(ang)*rr];};
  let g='';
  for(let ring=1;ring<=4;ring++){
    const p=[...Array(N)].map((_,k)=>pt(k,R*ring/4).join(',')).join(' ');
    g+=`<polygon points="${p}" fill="none" stroke="var(--ring)" stroke-width="1"/>`;
  }
  const pts=keys.map((k,idx)=>pt(idx, Math.max(0.10,stat[k]/maxv)*R).join(',')).join(' ');
  g+=`<polygon points="${pts}" fill="var(--fill)" stroke="var(--accent)" stroke-width="2.5"
       stroke-linejoin="round"/>`;
  keys.forEach((k,idx)=>{
    const [x,y]=pt(idx, Math.max(0.10,stat[k]/maxv)*R);
    g+=`<circle cx="${x}" cy="${y}" r="4" fill="var(--accent)"/>`;
    const [lx,ly]=pt(idx,R+26);
    g+=`<text x="${lx}" y="${ly-7}" fill="var(--dim)" font-size="12" text-anchor="middle"
         dominant-baseline="middle">${DIMS[k].th}</text>`;
    g+=`<text x="${lx}" y="${ly+10}" fill="var(--fg)" font-size="14" font-weight="700"
         text-anchor="middle" dominant-baseline="middle">${stat[k]}</text>`;
  });
  return `<svg viewBox="0 0 300 330" width="100%" style="max-width:320px">${g}</svg>`;
}

/* ---------- routine: แปลง action เป็นตารางสัปดาห์ที่ทำตามได้จริง ----------
   หลักการ: เริ่มทีละอย่าง · ผูกกับสิ่งที่ทำอยู่แล้ว · พลาดวันเดียวไม่ได้เริ่มใหม่
   (Lally et al. 2010 — เวลาสร้างนิสัยต่างกัน 18-254 วัน และการพลาดหนึ่งวัน
    ไม่ทำให้ความเป็นอัตโนมัติที่สะสมมาหายไป) */
function slotOf(m){
  if(/\/วัน|ทุกวัน/.test(m))      return {k:'daily',  when:'ทุกวัน ตอนก่อนปิดคอม'};
  if(/\/สัปดาห์/.test(m))         return {k:'weekly', when:'ทุกวันศุกร์ 16:00 — ชั่วโมงดูแลธุรกิจ'};
  if(/\/เดือน/.test(m))           return {k:'monthly',when:'วันแรกของเดือน ต่อจากชั่วโมงดูแลธุรกิจ'};
  if(/\/งาน/.test(m))             return {k:'perjob', when:'ทุกครั้งที่รับงานใหม่ ก่อนเริ่มทำ'};
  return {k:'once', when:'สัปดาห์นี้ เลือกวันที่ว่างที่สุด 1 วัน'};
}
function routine(prog){
  return prog.map((a,i)=>{
    const s=slotOf(a.m);
    return {n:a.n, when:s.when, kind:s.k,
      week: i===0 ? 'สัปดาห์ที่ 1' : i===1 ? 'สัปดาห์ที่ 2-3' : 'สัปดาห์ที่ 4 เป็นต้นไป'};
  });
}

/* ---------- radar เป็นรูป PNG สำหรับแนบไปกับอีเมล ----------
   ใช้ canvas ไม่ใช่ SVG เพราะ Gmail ตัด SVG ทิ้ง
   ป้ายกำกับใช้ชื่อมิติภาษาอังกฤษ เลี่ยงปัญหาฟอนต์ไทยบน canvas */
function radarPNG(stat){
  try{
    const S=2, W=420, H=420;                  // 840px จริง — คมพอสำหรับแสดงที่ 320px บนจอ retina
    const cv=document.createElement('canvas'); cv.width=W*S; cv.height=H*S;
    const g=cv.getContext('2d'); g.scale(S,S);
    g.fillStyle='#ffffff'; g.fillRect(0,0,W,H);

    const keys=Object.keys(DIMS), N=6, cx=W/2, cy=H/2+5, R=124, MAX=44;
    const pt=(k,rr)=>{const a=-Math.PI/2+k*2*Math.PI/N;
      return [cx+Math.cos(a)*rr, cy+Math.sin(a)*rr];};

    for(let ring=1;ring<=4;ring++){
      g.beginPath();
      for(let k=0;k<N;k++){const[x,y]=pt(k,R*ring/4); k?g.lineTo(x,y):g.moveTo(x,y);}
      g.closePath(); g.strokeStyle='#e2e0dc'; g.lineWidth=1; g.stroke();
    }
    for(let k=0;k<N;k++){const[x,y]=pt(k,R);
      g.beginPath(); g.moveTo(cx,cy); g.lineTo(x,y); g.strokeStyle='#eae8e4'; g.stroke();}

    g.beginPath();
    keys.forEach((k,idx)=>{const[x,y]=pt(idx,Math.max(0.10,stat[k]/MAX)*R); idx?g.lineTo(x,y):g.moveTo(x,y);});
    g.closePath();
    g.fillStyle='rgba(226,98,10,.20)'; g.fill();
    g.strokeStyle='#e2620a'; g.lineWidth=2.5; g.lineJoin='round'; g.stroke();

    keys.forEach((k,idx)=>{
      const[x,y]=pt(idx,Math.max(0.10,stat[k]/MAX)*R);
      g.beginPath(); g.arc(x,y,4.5,0,Math.PI*2); g.fillStyle='#e2620a'; g.fill();
      const[lx,ly]=pt(idx,R+28);
      g.textAlign='center'; g.textBaseline='middle';
      g.fillStyle='#6b6b76'; g.font='500 13px Helvetica, Arial, sans-serif';
      g.fillText(DIMS[k].th, lx, ly-8);
      g.fillStyle='#1a1a1e'; g.font='700 17px Helvetica, Arial, sans-serif';
      g.fillText(String(stat[k]), lx, ly+11);
    });

    return cv.toDataURL('image/png').split(',')[1];   // ตัด data: prefix ออก
  }catch(e){ return ''; }                              // วาดไม่ได้ก็ส่งอีเมลแบบไม่มีรูป
}

      <button class="cta" id="go">ทำต่อ</button></div>`;
    document.getElementById('go').onclick=()=>{showInter=null;render();};
    return;
  }
  // lead-in card?
  const lead=LEAD[i];
  if(lead && ans[i]===null && !window.__seenLead?.[i]){
    window.__seenLead=window.__seenLead||{}; window.__seenLead[i]=1;
    app.innerHTML=`<div class="inter"><div class="big">✦</div>
      <h1 style="margin-bottom:14px">${lead.t}</h1>
      <p>${lead.p}</p><button class="cta" id="go">เริ่ม</button></div>`;
    document.getElementById('go').onclick=render;
    return;
  }

  const q=Q[i], pct=(i/Q.length)*100;
  const tag = q.d==='intent' ? 'คำถามสุดท้าย' : DIMS[q.d].th+' · '+DIMS[q.d].full;
  app.innerHTML=`
    <div class="top"><div class="bar"><i style="width:${pct}%"></i></div>
      <span class="count">${i+1}/${Q.length}</span></div>
    <span class="dimtag">${tag}</span>
    <h1>${q.t}</h1>
    <div class="opts">${q.o.map((o,k)=>
      `<button class="opt${ans[i]===k?' sel':''}" data-k="${k}">${o[0]}</button>`).join('')}</div>
    ${q.n?`<div class="note"><b>ทำไมถามข้อนี้</b> — ${q.n}</div>`:''}
    ${i>0?'<button class="back" id="bk">← ย้อนกลับ</button>':''}`;

  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    ans[i]=+b.dataset.k;
    b.classList.add('sel');
    setTimeout(()=>{
      i++;
      if(INTER[i]) showInter=i;
      render(); window.scrollTo(0,0);
    },160);
  });
  const bk=document.getElementById('bk');
  if(bk) bk.onclick=()=>{i--;render();window.scrollTo(0,0);};
}

function renderResult(){
  const r=score(), prog=program(r), ph=PHASES[r.phase];
  const condPct=k=>Math.round(r.cond[k]/5*100);

  app.innerHTML=`
    <div class="rtitle">โปรไฟล์ธุรกิจของคุณ</div>
    <h2 id="rhead">Stat ธุรกิจของคุณ</h2>
    <span class="phase">ช่วงนี้: ${ph.n}</span>
    ${radar(r.stat)}
    <div class="statlist">
      ${Object.keys(DIMS).map(k=>`
        <div class="row">
          <span class="nm">${DIMS[k].th}</span>
          <span class="track"><i style="width:${Math.max(6,r.stat[k]/44*100)}%;
            background:${DIMS[k].color}"></i></span>
          <span class="val">${r.stat[k]}</span>
          <span class="cond">${condPct(k)}%</span>
        </div>`).join('')}
    </div>

    ${r.emergency?`<div class="alert"><div class="lab">ก่อนอย่างอื่น</div>
      <p>3 คำตอบล่าสุดบอกว่าคุณทำงานเกิน 60 ชั่วโมงและพลังงานเหลือน้อย —
      จะเปิด Emergency Mode สัก 1 สัปดาห์มั้ย ระหว่างนั้น stat ไม่หายและ streak ไม่ขาด</p></div>`:''}

    <div class="insight"><div class="lab">ช่วงนี้ของคุณ</div><p>${ph.d}</p></div>

    <h3>สิ่งที่ควรทำต่อจากนี้ (${prog.length} อย่าง)</h3>
    <p class="sub" style="margin-bottom:14px">เลือกมาจากเจตนาที่คุณตอบไว้: “${INTENT_FOCUS[r.intent].label}”</p>
    ${prog.map(a=>`<div class="act"><div class="an">${a.n}</div>
      <div class="am">${a.m}</div><div class="aw">${a.w}</div></div>`).join('')}

    <h3>เอาไปทำเป็นกิจวัตรยังไง</h3>
    <p class="sub" style="margin-bottom:14px">รู้ว่าควรทำอะไรกับทำได้จริง เป็นคนละเรื่องกัน —
    นี่คือวิธีวางมันลงในสัปดาห์ของคุณ</p>
    ${routine(prog).map((x,i)=>`<div class="act">
      <div class="am" style="color:var(--accent);margin-bottom:4px">${x.week}</div>
      <div class="an">${x.n}</div>
      <div class="am" style="margin-top:4px">🕐 ${x.when}</div></div>`).join('')}
    <div class="insight" style="margin-top:16px"><div class="lab">กฎ 3 ข้อของการเริ่ม</div>
      <p><b>1. เริ่มทีละอย่าง</b> — ทำข้อแรกให้ติดก่อน ค่อยเพิ่มข้อถัดไป
      คนที่เริ่มพร้อมกัน 5 อย่างมักไม่เหลือสักอย่างในเดือนที่สอง<br><br>
      <b>2. ผูกกับสิ่งที่ทำอยู่แล้ว</b> — "หลังปิดคอม" ทำงานได้ดีกว่า "ตอนเย็น"
      เพราะมีสิ่งที่มาสะกิดให้นึกออกจริง<br><br>
      <b>3. พลาดหนึ่งวันไม่ได้ทำให้ที่สะสมมาหายไป</b> — งานวิจัยการสร้างนิสัยพบว่า
      การขาดไปหนึ่งครั้งไม่ทำให้ต้องเริ่มนับหนึ่งใหม่ สิ่งที่ทำให้ล้มเหลวคือการเลิกหลังพลาด ไม่ใช่ตัวการพลาด</p>
    </div>

    <div id="leadbox"></div>

    <button class="ghost" id="again">เริ่มใหม่</button>
`;

  window.__last={r,prog,ph};
  renderLead();
  document.getElementById('again').onclick=()=>{
    ans.fill(null); i=0; stage='landing'; window.__seenLead={}; render(); window.scrollTo(0,0);};
  window.scrollTo(0,0);
}


/* ---------- เก็บข้อมูลติดต่อ (หลังเห็นผลแล้วเท่านั้น) ---------- */
function getLead(){ try{return JSON.parse(localStorage.getItem('sbp-lead')||'null')}catch(e){return null} }

function applyName(){
  const l=getLead(), h=document.getElementById('rhead');
  if(l&&l.biz&&h) h.textContent='Stat ของ '+l.biz;
}

function renderLead(){
  const box=document.getElementById('leadbox'); if(!box) return;
  const l=getLead();
  applyName();

  if(l&&l.sent){
    box.innerHTML=`<div class="lead">
      <h4>${l.delivered?'ส่งผลไปที่อีเมลของคุณแล้ว':'บันทึกข้อมูลของคุณไว้แล้ว'}</h4>
      <p class="ok">${l.email}</p>
      ${l.delivered
        ? `<p class="tiny" style="margin-top:14px">ในอีเมลจะมี stat 6 ด้านของคุณ ช่วงที่ธุรกิจคุณอยู่
           และสิ่งที่ควรทำต่อ — เก็บไว้เทียบตอนประเมินรอบหน้าได้<br>
           ถ้าไม่เห็นภายใน 10 นาที ลองดูในกล่องจดหมายขยะด้วยนะครับ</p>`
        : `<p class="tiny" style="color:var(--accent)">⚠ ระบบส่งอีเมลยังไม่ถูกตั้งค่า —
           ข้อมูลถูกเก็บไว้ในเครื่องนี้เท่านั้น ยังไม่ได้ส่งไปไหน</p>`}
      <button class="ghost" id="lclear">ลบข้อมูลนี้ออกจากเครื่อง</button>
    </div>`;
    document.getElementById('lclear').onclick=()=>{
      localStorage.removeItem('sbp-lead');
      const h=document.getElementById('rhead'); if(h) h.textContent='Stat ธุรกิจของคุณ';
      renderLead();};
    return;
  }

  box.innerHTML=`<div class="lead">
    <h4>รับผลฉบับเต็มทางอีเมล</h4>
    <p class="why">เราจะส่ง stat 6 ด้าน ช่วงที่ธุรกิจคุณอยู่ และสิ่งที่ควรทำต่อ ไปให้ทางอีเมล
    เก็บไว้เทียบตอนประเมินรอบหน้าได้ว่าอะไรขยับไปทางไหน</p>

    <label for="lname">ชื่อที่ให้เราเรียกคุณ</label>
    <input type="text" id="lname" placeholder="เช่น พีรัช" value="${l?.name||''}">

    <label for="lbiz">ชื่อธุรกิจ <span style="opacity:.7">(จะแสดงบนผลของคุณ)</span></label>
    <input type="text" id="lbiz" placeholder="เช่น Wizards of Learning" value="${l?.biz||''}">

    <label for="lmail">อีเมล</label>
    <input type="email" id="lmail" inputmode="email" placeholder="you@example.com" value="${l?.email||''}">

    <label class="consent"><input type="checkbox" id="lok">
      <span>ยินยอมให้ Wizards of Learning ใช้อีเมลนี้ส่งผลประเมิน
      และเนื้อหาเกี่ยวกับการดูแลธุรกิจคนเดียว — ไม่ส่งต่อให้ใคร และยกเลิกได้ทุกเมื่อ</span></label>

    <details class="pnotice"><summary>อ่านรายละเอียดการเก็บข้อมูล</summary>
      <div class="pbody">
        <b>ใครเก็บข้อมูลของคุณ</b>
        บริษัท รูม 22 จำกัด (Wizards of Learning)<br>
        149/9 ซอยวิภาวดีรังสิต 64 (มหานคร) แขวงตลาดบางเขน เขตหลักสี่ กรุงเทพมหานคร 10210<br>
        ติดต่อเรื่องข้อมูลส่วนบุคคล: <a href="mailto:contact@wizardsoflearning.com">contact@wizardsoflearning.com</a>

        <b>เก็บอะไร</b>
        อีเมล · ชื่อและชื่อธุรกิจ (ถ้ากรอก) · คำตอบ 25 ข้อและคะแนนที่คำนวณได้ · วันเวลาที่ทำแบบประเมิน

        <b>ไม่เก็บอะไร</b>
        จำนวนเงินของคุณ (แบบประเมินนี้ถามเป็นช่วงเท่านั้น) · ข้อมูลลูกค้าหรือบุคคลอื่นของคุณ ·
        ตำแหน่งที่ตั้ง · ข้อมูลอ่อนไหวตามที่กฎหมายกำหนด<br>
        ถ้าคุณไม่กรอกอีเมล คำตอบจะอยู่ในเบราว์เซอร์ของคุณเท่านั้น ไม่ถูกส่งมาที่เรา

        <b>เอาไปทำอะไร</b>
        ส่งผลประเมินกลับไปให้คุณ · ส่งเนื้อหาเกี่ยวกับการดูแลธุรกิจคนเดียว ·
        ดูภาพรวมแบบไม่ระบุตัวตนเพื่อปรับปรุงแบบประเมิน<br>
        อาศัยความยินยอมของคุณเป็นฐาน และถอนได้ทุกเมื่อ<br>
        เราไม่ขาย ไม่แลก และไม่ส่งต่อข้อมูลของคุณให้ใครเพื่อการตลาด

        <b>เก็บไว้นานแค่ไหน</b>
        เก็บต่อเนื่องเพื่อให้คุณเทียบผลรอบเก่ากับรอบใหม่ได้ ·
        ถ้าคุณขอลบหรือถอนความยินยอม จะลบภายใน 30 วัน ·
        ถ้าไม่มีการติดต่อกันเกิน 24 เดือน เราจะลบให้เองโดยไม่ต้องรอให้ขอ

        <b>เก็บไว้ที่ไหน</b>
        Google Workspace และ Google Sheets เข้าถึงได้เฉพาะผู้ที่ได้รับมอบหมายของเรา

        <b>สิทธิของคุณ</b>
        ตาม พ.ร.บ.คุ้มครองข้อมูลส่วนบุคคล พ.ศ. 2562 คุณมีสิทธิขอดู ขอแก้ไข ขอลบ ขอให้ระงับการใช้
        ขอรับสำเนา คัดค้านการใช้ ถอนความยินยอม และร้องเรียนต่อสำนักงานคณะกรรมการคุ้มครองข้อมูลส่วนบุคคล<br>
        ใช้สิทธิได้โดยส่งอีเมลมาที่ <a href="mailto:contact@wizardsoflearning.com">contact@wizardsoflearning.com</a>
        เราจะตอบกลับภายใน 30 วัน

        <b>คุกกี้</b>
        แบบประเมินนี้ไม่ใช้คุกกี้ติดตาม และไม่มีเครื่องมือวิเคราะห์ของบุคคลที่สาม
        ใช้เพียงพื้นที่จัดเก็บในเบราว์เซอร์ของคุณเพื่อจำคำตอบระหว่างทำ ซึ่งไม่ถูกส่งมาที่เรา
      </div>
    </details>

    <div class="err" id="lerr" style="display:none"></div>
    <button class="cta" id="lsave">ส่งผลไปที่อีเมลของฉัน</button>
    <p class="tiny">ไม่ถามตัวเลขการเงินของคุณในแบบประเมินนี้
    คำตอบทั้ง 25 ข้ออยู่ในเครื่องของคุณ</p>
  </div>`;

  document.getElementById('lsave').onclick=async ()=>{
    const btn=document.getElementById('lsave');
    const name=document.getElementById('lname').value.trim();
    const biz =document.getElementById('lbiz').value.trim();
    const email=document.getElementById('lmail').value.trim();
    const ok  =document.getElementById('lok').checked;
    const err =document.getElementById('lerr');
    const fail=m=>{err.textContent=m;err.style.display='block';
      btn.disabled=false;btn.textContent='ส่งผลไปที่อีเมลของฉัน'};

    err.style.display='none';
    if(!email) return fail('กรอกอีเมลก่อนนะครับ เราจะได้ส่งผลไปให้ได้');
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return fail('อีเมลยังไม่ถูกรูปแบบ');
    if(!ok) return fail('ติ๊กยินยอมก่อนครับ เราถึงจะส่งอีเมลให้ได้');

    btn.disabled=true; btn.textContent='กำลังส่ง…';
    const L={name,biz,email,consent:true,sent:true,delivered:false};

    if(ENDPOINT){
      try{
        const {r,prog,ph}=window.__last||{};
        const res=await fetch(ENDPOINT,{
          method:'POST',
          headers:{'Content-Type':'text/plain;charset=utf-8'},  // เลี่ยง preflight ของ Apps Script
          body:JSON.stringify({
            name,biz,email,consent:true,
            answers:ans.map((v,idx)=>Q[idx].o[v][1]),
            cond:r?.cond, stat:r?.stat, phase:r?.phase, intent:r?.intent,
            phaseName:ph?.n,

            routine:routine(prog||[]),
            actions:(prog||[]).map(a=>({n:a.n,m:a.m,w:a.w})),
            ua:navigator.userAgent.slice(0,120)
          })
        });
        const out=await res.json().catch(()=>({ok:false}));
        if(!out.ok) throw new Error(out.error||'ส่งไม่สำเร็จ');
        L.delivered=true;
      }catch(e){
        return fail('ส่งไม่สำเร็จ ลองใหม่อีกครั้งนะครับ — ถ้ายังไม่ได้ ทักมาที่ LINE ของเราได้เลย');
      }
    }

    localStorage.setItem('sbp-lead',JSON.stringify(L));
    renderLead(); window.scrollTo(0,document.body.scrollHeight);
  };
}

/* ---------- theme ---------- */
(function(){
  const root=document.documentElement, btn=document.getElementById('theme');
  const saved=localStorage.getItem('sbp-theme');
  const sysLight=window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches;
  const set=t=>{root.setAttribute('data-theme',t);btn.textContent=t==='light'?'🌙':'☀';
    localStorage.setItem('sbp-theme',t);};
  set(saved || (sysLight?'light':'dark'));
  btn.onclick=()=>set(root.getAttribute('data-theme')==='light'?'dark':'light');
})();

render();
</script>
